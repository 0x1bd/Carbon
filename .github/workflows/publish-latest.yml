name: Publish Latest Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: 0.1.0-26.1.2
            java: 25
          - branch: 0.1.0-1.21.11
            java: 21
          - branch: 0.1.0-1.21.4
            java: 21

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ matrix.branch }}
          fetch-depth: 1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: always

      - name: Build with Gradle
        run: ./gradlew --build-cache --stacktrace build

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          prop() {
            awk -F= -v key="$1" '$1 == key { print $2; exit }' gradle.properties
          }

          MOD_VERSION="$(prop mod_version)"
          MINECRAFT_VERSION="$(prop minecraft_version)"
          RELEASE_VERSION="${MOD_VERSION}-${MINECRAFT_VERSION}"

          for loader in fabric neoforge; do
            input="Carbon-${loader}-${RELEASE_VERSION}.jar"
            source="${loader}/build/libs/${input}"
            target="release-artifacts/Carbon-${RELEASE_VERSION}-${loader}.jar"

            if [ ! -f "$source" ]; then
              echo "Expected release jar not found: $source"
              find "${loader}/build/libs" -maxdepth 1 -type f -name '*.jar' -print || true
              exit 1
            fi

            cp "$source" "$target"
          done

          ls -la release-artifacts

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.branch }}
          path: release-artifacts/*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -la release-artifacts

      - name: Publish Latest Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: release-artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
