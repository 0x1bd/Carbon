name: Publish Latest Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: 0.1.0-26.1.2
            java: 25
          - branch: 0.1.0-1.21.11
            java: 21
          - branch: 0.1.0-1.21.4
            java: 21

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ matrix.branch }}
          fetch-depth: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build with Gradle
        run: ./gradlew build --build-cache

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          
          BRANCH_SAFE="${{ matrix.branch }}"
          
          for dir in fabric/build/libs neoforge/build/libs; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.jar; do
                [ -e "$file" ] || continue
          
                base="$(basename "$file")"
                loader="$(echo "$dir" | cut -d/ -f1)"
          
                cp "$file" "release-artifacts/Carbon-${BRANCH_SAFE}-${loader}-${base}"
              done
            fi
          done
          
          ls -la release-artifacts

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.branch }}
          path: release-artifacts/*.jar

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish Latest Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: release-artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}